name = "workflow-svelte-cf-app"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "enable_weak_ref"]
main = "./.svelte-kit/cloudflare/index.js"

[build]
command = "pnpm build"

[assets]
directory = "./dist"
binding = "ASSETS"

[[services]]
binding = "WORKFLOW_RUNTIME"
service = "my-cloudflare-world"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
WORKFLOW_TARGET_WORLD = "workflow-cloudflare-world"
# This alone will not reroute the workflow executions to the cloudflare world, so you have to set the 
# This is there to prevent WORKFLOW_TARGET_WORLD to be set as local by default
