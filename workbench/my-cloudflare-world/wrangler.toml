# This wrangler.toml file is generated by the workflow-cloudflare-world CLI.
# It configures a standalone Cloudflare runtime for executing workflows.

name = "my-cloudflare-world"
main = "./node_modules/workflow-cloudflare-world/dist/src/worker.js"
compatibility_date = "2024-05-01"
compatibility_flags = ["nodejs_compat"]

# Bindings for the workflow system's state and orchestration
# -----------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "my-cloudflare-world-db"
migrations_dir = "migrations"
database_id = "091e0de3-f21e-41ff-a3a2-2e946bd410ca"

[[queues.producers]]
binding = "my_cloudflare_world_workflows"
queue = "my-cloudflare-world-workflows"

[[queues.producers]]
binding = "my_cloudflare_world_steps"
queue = "my-cloudflare-world-steps"

[[queues.consumers]]
queue = "my-cloudflare-world-workflows"

[[queues.consumers]]
queue = "my-cloudflare-world-steps"

[[r2_buckets]]
binding = "STREAM_BUCKET"
bucket_name = "my-cloudflare-world-streams"

# Bindings for Durable Objects and Containers
# -------------------------------------------
# These are required for stream coordination and deterministic workflow execution.

[durable_objects]
bindings = [
  { name = "STREAM_COORDINATOR", class_name = "StreamCoordinator" },
  { name = "WORKFLOW_EXECUTOR", class_name = "WorkflowExecutorContainer" }
]

# Migration for the SQLite-backed Durable Object classes is required by Wrangler.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["StreamCoordinator", "WorkflowExecutorContainer"]

[[containers]]
# Match the Durable Object class name so the container binding resolves correctly.
class_name = "WorkflowExecutorContainer"
image = "./Dockerfile"

# Service binding for inter-worker communication
# ----------------------------------------------
# Your separate application workers will use this binding to securely
# communicate with this deployed workflow runtime.

[[services]]
binding = "WORKFLOW_RUNTIME"
service = "my-cloudflare-world"

# Observability configuration
# ---------------------------
# Configure observability settings for the workflow runtime.

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1